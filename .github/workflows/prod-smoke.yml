name: Production smoke
# Catch DEPLOYMENT_NOT_FOUND / API host detach / 5xx before users do.
# Daily schedule (not */15) to conserve Actions minutes; also on main deploys
# that touch API/routing, plus manual dispatch.
on:
  schedule:
    - cron: "0 15 * * *" # 15:00 UTC daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/prod-smoke.sh"
      - "scripts/ensure-prod-domains.sh"
      - "scripts/check-api-host-routes.js"
      - "api/**"
      - "vercel.json"
      - ".github/workflows/prod-smoke.yml"

jobs:
  http-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Production HTTP smoke
        env:
          SUPERCOMPRESS_API_KEY: ${{ secrets.SUPERCOMPRESS_API_KEY }}
        run: bash scripts/prod-smoke.sh
