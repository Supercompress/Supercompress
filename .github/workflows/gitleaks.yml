name: Secret scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # OSS binary — gitleaks-action@v2 needs a paid org license.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VER=v8.21.2
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${VER}/gitleaks_${VER#v}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run gitleaks on HEAD tree
        # Scan the commit tree (not full git history). Historical doc
        # placeholders (sc_live_...) otherwise create permanent false positives.
        run: gitleaks detect --source . --no-git --verbose --redact --exit-code 1
