name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python package smoke
        run: |
          pip install -e . -q
          python - <<'PY'
          from supercompress import CompressResult, compress_for_turn
          from supercompress.client import CompressResult as CR2
          assert CompressResult is CR2
          r = compress_for_turn("a\nb\nc\nd", "what is b?", budget_ratio=0.5)
          assert isinstance(r, CompressResult)
          assert r.compressed_text  # context only — query is not auto-appended
          assert "what is b?" not in r.compressed_text
          try:
              compress_for_turn("x", "q", budget_ratio=0)
              raise SystemExit("expected ValueError")
          except ValueError:
              pass
          try:
              compress_for_turn("x", "q", mode="precision")
              raise SystemExit("expected RuntimeError without key")
          except RuntimeError:
              pass
          print("ok", r.policy_name, r.tokens_saved_pct)
          PY
          python examples/integrations/openai_wrapper.py >/dev/null
          python examples/integrations/langchain_hook.py >/dev/null
          python examples/demo_compare.py >/dev/null
      - name: Install JS deps
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: JS syntax smoke
        run: |
          node --check api/demo/compress.js
          node --check api/_lib/store.js
          node --check api/_lib/engine.js
          node --check api/_lib/billing-ledger.js
          node --check packages/proxy/src/compressor.js
          node --check packages/proxy/src/forwarder.js
          node --check packages/proxy/src/server.js
      - name: Billing ledger unit tests
        run: node api/_lib/billing-ledger.test.js
      - name: Coding agent monthly usage unit tests
        run: node api/_lib/coding-agent-usage.test.js
      - name: Power-user milestone unit tests
        run: node api/_lib/power-user.test.js
      - name: Resend webhook signature unit tests
        run: node api/_lib/resend-webhook.test.js
      - name: Analytics aggregation unit tests
        run: node web/assets/js/analytics-data.test.js
      - name: Proxy package tests
        run: |
          cd packages/proxy
          node test/smoke.js
          node test/agent-plugins.js
          node test/uninstall-clean.js
          if [ -f test/protocol-safety.js ]; then node test/protocol-safety.js; fi
      - name: Proxy npm pack clean-install smoke
        run: |
          set -euo pipefail
          cd packages/proxy
          tgz=$(npm pack 2>/dev/null | tail -1)
          test -n "$tgz" && test -f "$tgz"
          tmp=$(mktemp -d)
          abs_tgz="$PWD/$tgz"
          cd "$tmp"
          npm init -y >/dev/null
          npm install "$abs_tgz"
          node -e "require('supercompress-proxy/src/compressor'); require('supercompress-proxy/src/forwarder'); console.log('pack ok')"
          node - <<'NODE'
          const fs = require("fs");
          const p = require.resolve("supercompress-proxy/src/forwarder");
          const s = fs.readFileSync(p, "utf8");
          if (/require\(["']node-fetch["']\)/.test(s)) {
            console.error("FAIL: packed forwarder still requires node-fetch");
            process.exit(1);
          }
          console.log("native fetch ok");
          NODE
      - name: No PII / private email ops in tree
        run: node scripts/check-no-pii.js
      - name: Version pins
        run: node scripts/check-versions.js
      - name: API host redirect guard (no catch-all /compress 308)
        run: |
          node scripts/check-api-host-routes.test.js
          node scripts/check-api-host-routes.js
