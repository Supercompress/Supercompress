[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "supercompress"
version = "0.6.1"
description = "Prompt compression for LLM applications — reduce tokens, cut costs, maintain quality"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "llm", "prompt-compression", "token-reduction",
    "ai", "cost-savings", "context-window",
]
authors = [
    {name = "Arjun Shah", email = "arjunkshah21@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://supercompress.dev"
Documentation = "https://docs.supercompress.dev/"
Repository = "https://github.com/Supercompress/Supercompress"
Issues = "https://github.com/Supercompress/Supercompress/issues"

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
dev = ["build>=1.0", "twine>=5.0"]

[tool.setuptools.packages.find]
include = ["supercompress", "supercompress.*"]

[tool.setuptools.package-data]
supercompress = ["py.typed"]
