# Fly.io app for SuperCompress Neural Keep.
# Product path: v4-large (~395.8M ModernBERT-large) + int8 dynamic quant for cost.
# Do NOT deploy the base-distill (~150M) as the live product model — users saw ~1–20% cuts.

app = "sc-neural-keep"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  SC_NEURAL_DIR = "/app/model"
  SC_NEURAL_DEVICE = "cpu"
  SC_NEURAL_LAZY_LOAD = "0"
  SC_ARENA = "0"
  OMP_NUM_THREADS = "2"
  MKL_NUM_THREADS = "2"
  OPENBLAS_NUM_THREADS = "2"
  TORCH_NUM_THREADS = "2"
  SC_NEURAL_INFER_TIMEOUT_S = "120"
  # More lines than distill's 96 — agent dumps need real scoring, not head/tail only.
  SC_NEURAL_BATCH = "12"
  SC_NEURAL_MAX_LINES = "384"
  SC_NEURAL_MAX_LENGTH = "160"
  SC_NEURAL_CHECKPOINT = "sc-keep-crossencoder-v4-large"
  SC_NEURAL_EXPECTED_BYTES = "1583351632"
  SC_NEURAL_EXPECTED_PARAMS_M = "395.83"
  # 0.12 kept almost everything in prod; 0.42 targets real cuts with v4-large.
  SC_NEURAL_THRESHOLD = "0.42"
  SC_NEURAL_BUSY_WAIT_S = "12"
  SC_NEURAL_TIMEOUT_EXITS = "0"
  # Keep inference cost down without shrinking the model.
  SC_NEURAL_QUANTIZE = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 12
    soft_limit = 6

# Large + int8 needs headroom (was thrashing / timing out at 2–4GB on distill path).
[[vm]]
  memory = "8192mb"
  cpu_kind = "shared"
  cpus = 2
