# Fly.io app for SuperCompress Neural Keep cross-encoder.
# Create once: fly apps create sc-neural-keep
# Volume for weights: fly volumes create neural_weights --region sjc --size 10

app = "sc-neural-keep"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  SC_NEURAL_DIR = "/data/model"
  SC_NEURAL_DEVICE = "cpu"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 4
    soft_limit = 2

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

[mounts]
  source = "neural_weights"
  destination = "/data/model"

[checks]
  [checks.health]
    grace_period = "120s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8080
    timeout = "10s"
    type = "http"
