# Fly.io app for SuperCompress Neural Keep cross-encoder.
# Create once: fly apps create sc-neural-keep
# Volume for weights: fly volumes create neural_weights --region sjc --size 10

app = "sc-neural-keep"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  SC_NEURAL_DIR = "/data/model"
  SC_NEURAL_DEVICE = "cpu"
  SC_NEURAL_LAZY_LOAD = "0"
  SC_ARENA = "0"
  OMP_NUM_THREADS = "4"
  MKL_NUM_THREADS = "4"
  OPENBLAS_NUM_THREADS = "4"
  TORCH_NUM_THREADS = "4"
  SC_NEURAL_INFER_TIMEOUT_S = "90"
  SC_NEURAL_BATCH = "32"
  SC_NEURAL_MAX_LINES = "128"
  SC_NEURAL_MAX_LENGTH = "128"
  SC_NEURAL_CHECKPOINT = "sc-keep-crossencoder-v4-large"
  SC_NEURAL_EXPECTED_BYTES = "1583351632"
  SC_NEURAL_EXPECTED_PARAMS_M = "395.83"

[http_service]
  internal_port = 8080
  force_https = true
  # Stay warm — cold-loading ~400M on shared CPU is what caused 502 storms.
  # Cost: one shared-cpu-4x 8GB machine on the existing Fly credit.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    # App still serializes compress (inflight=1). Soft/hard must leave headroom
    # for /health+/ready or Fly queues them behind a long CPU job → "hangs"/502s.
    hard_limit = 8
    soft_limit = 4

[[vm]]
  memory = "8gb"
  cpu_kind = "shared"
  cpus = 4

[mounts]
  source = "neural_weights"
  destination = "/data/model"

# TCP liveness — does NOT run Python/torch. HTTP /health used to time out while
# the GIL was held during inference → Fly marked the machine critical → 502s.
[checks]
  [checks.alive]
    type = "tcp"
    port = 8080
    interval = "15s"
    timeout = "2s"
    grace_period = "120s"
