# Fly.io app for SuperCompress Neural Keep.
# Product path: v4-large (~395.8M) fp32 — int8 collapses keep scores on ModernBERT-large.
# Do NOT deploy base-distill (~150M) as the live product model — users saw ~1–20% cuts.
# Live image bakes weights at /app/model (private build context; not in OSS git).

app = "sc-neural-keep"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  SC_NEURAL_DIR = "/app/model"
  SC_NEURAL_DEVICE = "cpu"
  SC_NEURAL_LAZY_LOAD = "0"
  SC_ARENA = "0"
  OMP_NUM_THREADS = "4"
  MKL_NUM_THREADS = "4"
  OPENBLAS_NUM_THREADS = "4"
  TORCH_NUM_THREADS = "4"
  SC_NEURAL_INFER_TIMEOUT_S = "120"
  SC_NEURAL_BATCH = "16"
  SC_NEURAL_MAX_LINES = "256"
  SC_NEURAL_MAX_LENGTH = "128"
  SC_NEURAL_CHECKPOINT = "sc-keep-crossencoder-v4-large"
  SC_NEURAL_EXPECTED_BYTES = "1583351632"
  SC_NEURAL_EXPECTED_PARAMS_M = "395.83"
  SC_NEURAL_THRESHOLD = "0.42"
  SC_NEURAL_BUSY_WAIT_S = "12"
  SC_NEURAL_TIMEOUT_EXITS = "0"
  # int8 destroys ModernBERT-large probs — leave off.
  SC_NEURAL_QUANTIZE = "0"

[http_service]
  internal_port = 8080
  force_https = true
  # Stay warm — cold-loading ~400M on shared CPU caused 502 storms.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    # App serializes compress (inflight=1). Headroom for /health+/ready + retries.
    hard_limit = 32
    soft_limit = 16

[[vm]]
  memory = "8gb"
  cpu_kind = "shared"
  cpus = 4

# TCP liveness — does NOT run Python/torch. HTTP /health used to time out while
# the GIL was held during inference → Fly marked the machine critical → 502s.
[checks]
  [checks.alive]
    type = "tcp"
    port = 8080
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"
